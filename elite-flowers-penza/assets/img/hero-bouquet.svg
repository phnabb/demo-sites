<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Иллюстрация букета Elite Flowers в шалфейно-льняной палитре">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7F3"/>
      <stop offset="1" stop-color="#E8EEE5"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroWrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EDE3"/>
      <stop offset="1" stop-color="#CFDCCB"/>
    </linearGradient>
    <g id="heroRose">
      <circle r="46" fill="#CFDCCB"/>
      <circle r="34" fill="#B9CBB4"/>
      <circle r="22" fill="#7FA08C"/>
      <circle r="10" fill="#5E816C"/>
    </g>
    <g id="heroLilac">
      <circle r="36" fill="#C3D0BC"/>
      <circle r="26" fill="#A4B89C"/>
      <circle r="15" fill="#8AA081"/>
    </g>
    <g id="heroPeony">
      <circle r="54" fill="#EEF3EB"/>
      <circle r="42" fill="#DCE7D7"/>
      <circle r="28" fill="#B9CBB4"/>
      <circle r="14" fill="#7FA08C"/>
    </g>
    <g id="heroGold">
      <circle r="30" fill="#D8D2BC"/>
      <circle r="20" fill="#C2BA9B"/>
      <circle r="10" fill="#B4A483"/>
    </g>
    <g id="heroLeaf">
      <ellipse rx="38" ry="15" fill="#8FA88A"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <circle cx="820" cy="420" r="430" fill="url(#heroGlow)"/>
  <circle cx="1290" cy="230" r="180" fill="#E9EFE6" opacity="0.7"/>
  <circle cx="300" cy="780" r="220" fill="#E3EAE0" opacity="0.6"/>

  <!-- зелень -->
  <g transform="translate(820 520)">
    <use href="#heroLeaf" transform="translate(-160 -20) rotate(-42)"/>
    <use href="#heroLeaf" transform="translate(170 -10) rotate(42)"/>
    <use href="#heroLeaf" transform="translate(-200 70) rotate(-22)"/>
    <use href="#heroLeaf" transform="translate(190 70) rotate(22)"/>
    <use href="#heroLeaf" transform="translate(-80 -170) rotate(-72)"/>
    <use href="#heroLeaf" transform="translate(90 -180) rotate(72)"/>
  </g>

  <!-- упаковка -->
  <path d="M820 520 C 630 620 570 810 630 890 L 1010 890 C 1070 810 1010 620 820 520 Z" fill="url(#heroWrap)" opacity="0.95"/>
  <path d="M820 520 C 760 650 740 780 750 890" stroke="#C4D2BE" stroke-width="6" fill="none" opacity="0.55"/>
  <path d="M820 520 C 880 650 900 780 890 890" stroke="#C4D2BE" stroke-width="6" fill="none" opacity="0.55"/>

  <!-- цветы -->
  <use href="#heroPeony" transform="translate(820 470)"/>
  <use href="#heroRose" transform="translate(660 470)"/>
  <use href="#heroRose" transform="translate(980 470)"/>
  <use href="#heroLilac" transform="translate(730 360)"/>
  <use href="#heroLilac" transform="translate(910 360)"/>
  <use href="#heroGold" transform="translate(820 330)"/>
  <use href="#heroPeony" transform="translate(820 300) scale(-1 1)"/>
  <use href="#heroLilac" transform="translate(660 330) scale(-1 1)"/>
  <use href="#heroLilac" transform="translate(980 330)"/>
</svg>
