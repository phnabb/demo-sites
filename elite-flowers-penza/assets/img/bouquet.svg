<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Иллюстрация букета в шалфейно-льняных тонах">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7F3"/>
      <stop offset="1" stop-color="#E8EEE5"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardWrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EDE3"/>
      <stop offset="1" stop-color="#CFDCCB"/>
    </linearGradient>
    <g id="bRose">
      <circle r="60" fill="#CFDCCB"/>
      <circle r="44" fill="#B9CBB4"/>
      <circle r="28" fill="#7FA08C"/>
      <circle r="13" fill="#5E816C"/>
    </g>
    <g id="bLilac">
      <circle r="46" fill="#C3D0BC"/>
      <circle r="32" fill="#A4B89C"/>
      <circle r="18" fill="#8AA081"/>
    </g>
    <g id="bPeony">
      <circle r="70" fill="#EEF3EB"/>
      <circle r="54" fill="#DCE7D7"/>
      <circle r="36" fill="#B9CBB4"/>
      <circle r="18" fill="#7FA08C"/>
    </g>
    <g id="bGold">
      <circle r="40" fill="#D8D2BC"/>
      <circle r="26" fill="#C2BA9B"/>
      <circle r="13" fill="#B4A483"/>
    </g>
    <g id="bLeaf">
      <ellipse rx="46" ry="18" fill="#8FA88A"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="url(#cardBg)"/>
  <circle cx="400" cy="380" r="330" fill="url(#cardGlow)"/>
  <circle cx="120" cy="200" r="120" fill="#E9EFE6" opacity="0.7"/>
  <circle cx="690" cy="820" r="150" fill="#E3EAE0" opacity="0.6"/>

  <!-- зелень -->
  <g transform="translate(400 540)">
    <use href="#bLeaf" transform="translate(-150 -30) rotate(-45)"/>
    <use href="#bLeaf" transform="translate(160 -20) rotate(45)"/>
    <use href="#bLeaf" transform="translate(-190 80) rotate(-25)"/>
    <use href="#bLeaf" transform="translate(190 80) rotate(25)"/>
    <use href="#bLeaf" transform="translate(-80 -180) rotate(-75)"/>
    <use href="#bLeaf" transform="translate(90 -190) rotate(75)"/>
  </g>

  <!-- упаковка -->
  <path d="M400 540 C 220 640 170 840 230 940 L 570 940 C 630 840 580 640 400 540 Z" fill="url(#cardWrap)" opacity="0.95"/>
  <path d="M400 540 C 340 680 320 820 330 940" stroke="#C4D2BE" stroke-width="6" fill="none" opacity="0.55"/>
  <path d="M400 540 C 460 680 480 820 470 940" stroke="#C4D2BE" stroke-width="6" fill="none" opacity="0.55"/>

  <!-- цветы -->
  <use href="#bPeony" transform="translate(400 470)"/>
  <use href="#bRose" transform="translate(250 470)"/>
  <use href="#bRose" transform="translate(550 470)"/>
  <use href="#bLilac" transform="translate(310 350)"/>
  <use href="#bLilac" transform="translate(490 350)"/>
  <use href="#bGold" transform="translate(400 320)"/>
  <use href="#bRose" transform="translate(400 200)"/>
  <use href="#bLilac" transform="translate(260 240)"/>
  <use href="#bLilac" transform="translate(540 240)"/>
</svg>
