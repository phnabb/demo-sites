<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Иллюстрация букета в лавандово-пудровых тонах">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8FD"/>
      <stop offset="1" stop-color="#F5E6F0"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardWrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E7FB"/>
      <stop offset="1" stop-color="#D9C7F0"/>
    </linearGradient>
    <g id="bRose">
      <circle r="60" fill="#D9C7F0"/>
      <circle r="44" fill="#C3A9EA"/>
      <circle r="28" fill="#9B7EDE"/>
      <circle r="13" fill="#8365C9"/>
    </g>
    <g id="bLilac">
      <circle r="46" fill="#D8C9F2"/>
      <circle r="32" fill="#C3A9EA"/>
      <circle r="18" fill="#9B7EDE"/>
    </g>
    <g id="bPeony">
      <circle r="70" fill="#F7E9F8"/>
      <circle r="54" fill="#EBD3F0"/>
      <circle r="36" fill="#D9C7F0"/>
      <circle r="18" fill="#9B7EDE"/>
    </g>
    <g id="bGold">
      <circle r="40" fill="#E4D3F3"/>
      <circle r="26" fill="#C9AEEA"/>
      <circle r="13" fill="#B892D6"/>
    </g>
    <g id="bLeaf">
      <ellipse rx="46" ry="18" fill="#9BAE8E"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="url(#cardBg)"/>
  <circle cx="400" cy="380" r="330" fill="url(#cardGlow)"/>
  <circle cx="120" cy="200" r="120" fill="#F3E9FA" opacity="0.7"/>
  <circle cx="690" cy="820" r="150" fill="#EDE4F7" opacity="0.6"/>

  <!-- зелень -->
  <g transform="translate(400 540)">
    <use href="#bLeaf" transform="translate(-150 -30) rotate(-45)"/>
    <use href="#bLeaf" transform="translate(160 -20) rotate(45)"/>
    <use href="#bLeaf" transform="translate(-190 80) rotate(-25)"/>
    <use href="#bLeaf" transform="translate(190 80) rotate(25)"/>
    <use href="#bLeaf" transform="translate(-80 -180) rotate(-75)"/>
    <use href="#bLeaf" transform="translate(90 -190) rotate(75)"/>
  </g>

  <!-- упаковка -->
  <path d="M400 540 C 220 640 170 840 230 940 L 570 940 C 630 840 580 640 400 540 Z" fill="url(#cardWrap)" opacity="0.95"/>
  <path d="M400 540 C 340 680 320 820 330 940" stroke="#CBB6E6" stroke-width="6" fill="none" opacity="0.55"/>
  <path d="M400 540 C 460 680 480 820 470 940" stroke="#CBB6E6" stroke-width="6" fill="none" opacity="0.55"/>

  <!-- цветы -->
  <use href="#bPeony" transform="translate(400 470)"/>
  <use href="#bRose" transform="translate(250 470)"/>
  <use href="#bRose" transform="translate(550 470)"/>
  <use href="#bLilac" transform="translate(310 350)"/>
  <use href="#bLilac" transform="translate(490 350)"/>
  <use href="#bGold" transform="translate(400 320)"/>
  <use href="#bRose" transform="translate(400 200)"/>
  <use href="#bLilac" transform="translate(260 240)"/>
  <use href="#bLilac" transform="translate(540 240)"/>
</svg>
